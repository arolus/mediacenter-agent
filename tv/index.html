<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MediaCenter TV</title>
  <meta name="theme-color" content="#09090b" />
  <!-- Иконки и PWA-манифест (красивый ярлык на рабочем столе, ландшафтная ориентация) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MediaCenter TV" />
  <!-- База до загрузки Tailwind (без вспышки нестилизованного) + утилиты, которые JS переключает -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1100px 550px at 15% -10%, rgba(124, 58, 237, .16), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(79, 70, 229, .12), transparent 60%),
        #09090b; }
    .hidden { display: none !important; }
    /* ПРИНУДИТЕЛЬНЫЙ ЛАНДШАФТ: если устройство в портрете, поворачиваем весь UI на 90°.
       Все размеры внутри считаются от "UI-вьюпорта": --uivh/--uivw подменяют vh/vw. */
    :root { --uivh: 1vh; --uivw: 1vw; }
    #rot { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
    @media (orientation: portrait) {
      :root { --uivh: 1vw; --uivw: 1vh; }
      #rot {
        width: 100vh; height: 100vw;
        transform: rotate(90deg) translateY(-100%);
        transform-origin: top left;
      }
    }
    #app { height: 100%; }
    /* Статус-иконки агента (правый верхний угол, поверх всех экранов): терминал = агент
       (Termux), облако = сервер (Firebase), волны = live (SSE). Цвет = состояние;
       стейт-классы переключает JS: st-ok (зелёный) / st-bad (красный) / st-off (серый). */
    #status-dots { position: fixed; top: 4px; right: 7px; z-index: 50; display: flex; pointer-events: none; }
    .st-dot { width: 11px; height: 11px; margin-left: 6px; color: #3f3f46;
      transition: color .3s; filter: drop-shadow(0 0 3px rgba(0,0,0,.7)); }
    .st-dot svg { display: block; width: 100%; height: 100%; }
    .st-ok  { color: #22c55e; }
    .st-bad { color: #ef4444; }
    .st-off { color: #3f3f46; }
    /* Запас при подскролле к сфокусированной карточке: без него scrollIntoView(nearest)
       прижимает карточку к краю скролл-зоны, и focus-scale/кольцо обрезаются. */
    .tv-card { scroll-margin: 30px; }
    /* Тонкий скроллбар для горизонтальных лент (актёры на детальной) */
    .thin-scroll::-webkit-scrollbar { height: 3px; width: 3px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .25); border-radius: 2px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
  <!-- Tailwind (Play CDN, завендорен локально — ноды работают без интернета) -->
  <script src="/tailwind.js"></script>
</head>
<body>
  <div id="rot">
    <div id="app">
      <div class="flex h-full w-full flex-col items-center justify-center space-y-4">
        <svg class="h-10 w-10 animate-spin text-violet-400" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div class="text-lg text-zinc-400">Загружаю медиатеку…</div>
      </div>
    </div>

    <!-- Статус агента: терминал — «агент» (HTTP до Termux), облако — «сервер» (Firebase),
         волны — «live» (SSE). fixed внутри #rot — как overlay, корректно поверх повёрнутого UI. -->
    <div id="status-dots">
      <span id="st-agent" class="st-dot st-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m7 9 3 3-3 3"/><path d="M13 15h4"/></svg></span>
      <span id="st-cloud" class="st-dot st-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a4 4 0 0 0 0-8z"/></svg></span>
      <span id="st-live"  class="st-dot st-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.6" fill="currentColor" stroke="none"/></svg></span>
    </div>

    <!-- Оверлей статуса (запуск плеера, установка VLC); fixed внутри #rot = поверх повёрнутого UI -->
    <div id="tv-overlay" class="hidden fixed top-0 right-0 bottom-0 left-0 z-30 flex items-center justify-center bg-black/70 backdrop-blur-sm">
      <div class="flex items-center space-x-4 rounded-3xl border border-white/10 bg-zinc-900/90 px-10 py-6 text-2xl font-semibold shadow-2xl shadow-black/60 backdrop-blur" id="tv-overlay-text"></div>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
  <script src="/app.js"></script>
</body>
</html>
