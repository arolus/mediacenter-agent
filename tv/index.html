<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MediaCenter TV</title>
  <meta name="theme-color" content="#09090b" />
  <!-- Иконки и PWA-манифест (красивый ярлык на рабочем столе, ландшафтная ориентация) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MediaCenter TV" />
  <!-- База до загрузки Tailwind (без вспышки нестилизованного) + утилиты, которые JS переключает -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1100px 550px at 15% -10%, rgba(124, 58, 237, .16), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(79, 70, 229, .12), transparent 60%),
        #09090b; }
    .hidden { display: none !important; }
    /* Подсказка «поверни телефон» — только в портрете */
    #rotate-hint { display: none; }
    @media (orientation: portrait) { #rotate-hint:not(.dismissed) { display: flex; } }
  </style>
  <!-- Tailwind (Play CDN, завендорен локально — ноды работают без интернета) -->
  <script src="/tailwind.js"></script>
</head>
<body>
  <div id="app"><p class="tv-empty p-14 text-2xl text-zinc-400">Загружаю…</p></div>

  <!-- Оверлей статуса (запуск плеера, установка VLC) -->
  <!-- Chrome на нодах бывает старый (83): без inset-0 / aspect-ratio / flex-gap — только top/left/right/bottom, padding-трюк и space-* -->
  <div id="tv-overlay" class="hidden fixed top-0 right-0 bottom-0 left-0 z-30 flex items-center justify-center bg-black/70 backdrop-blur-sm">
    <div class="flex items-center space-x-4 rounded-3xl border border-white/10 bg-zinc-900/90 px-10 py-6 text-2xl font-semibold shadow-2xl shadow-black/60 backdrop-blur" id="tv-overlay-text"></div>
  </div>

  <!-- Портрет: TV-режим рассчитан на ландшафт -->
  <div id="rotate-hint" class="fixed top-0 right-0 bottom-0 left-0 z-40 flex-col items-center justify-center space-y-6 bg-zinc-950/95 p-10 text-center backdrop-blur">
    <svg class="h-20 w-20 text-violet-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="3" width="10" height="18" rx="2"/>
      <path d="M2.5 9.5A9.5 9.5 0 0 1 6 4.2M21.5 14.5a9.5 9.5 0 0 1-3.5 5.3"/>
      <path d="m2 6 .5 3.5L6 9M22 18l-.5-3.5L18 15"/>
    </svg>
    <div class="text-2xl font-bold">Поверни телефон горизонтально</div>
    <div class="max-w-md text-lg text-zinc-400">TV-режим рассчитан на ландшафтную ориентацию (телефон → HDMI → телевизор)</div>
    <button id="rotate-dismiss" class="mt-2 cursor-pointer rounded-xl border border-zinc-700 bg-zinc-900 px-6 py-2.5 text-base font-semibold text-zinc-300">Продолжить так</button>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
    document.getElementById("rotate-dismiss").addEventListener("click", () =>
      document.getElementById("rotate-hint").classList.add("dismissed"));
  </script>
  <script src="/app.js"></script>
</body>
</html>
