<!DOCTYPE html>
<!-- First-run screen: the node has no config yet. Two ways in:
     - standalone (default): MCApp.startStandalone() writes a local config, the agent boots without
       a server and the TV page then shows the phone-setup QR;
     - server: a QR that opens the dashboard with an enrollment token; the owner approves there
       and the agent picks the config up from the `enroll` Cloud Function.
     Opened by MainActivity as file:///android_asset/tv/enroll.html#<token>|<device model> -->
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MediaCenter — добавление устройства</title>
<style>
  html, body { margin: 0; height: 100%; background: #09090b; color: #e4e4e7;
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: clamp(20px, 4vh, 34px); margin: 0 0 8px; font-weight: 800; }
  p  { color: #a1a1aa; font-size: clamp(13px, 2.4vh, 18px); margin: 4px 0; max-width: 640px; }
  #qr { background: #fff; padding: 16px; border-radius: 16px; margin: 22px 0;
    box-shadow: 0 0 60px rgba(139, 92, 246, .35); }
  #qr img { display: block; width: clamp(180px, 34vh, 320px); height: auto;
    image-rendering: pixelated; }
  .dots::after { content: ""; animation: d 1.5s steps(4) infinite; }
  @keyframes d { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .ok { color: #34d399; font-weight: 700; font-size: clamp(16px, 3vh, 24px); }
  .btn { display: block; width: min(560px, 80vw); margin: 10px auto 0; padding: 18px 24px;
    border-radius: 18px; border: 2px solid #3f3f46; background: #18181b; color: #e4e4e7;
    font: inherit; font-size: clamp(16px, 2.8vh, 22px); font-weight: 700; outline: none;
    transition: transform .12s, border-color .12s, box-shadow .12s; }
  .btn small { display: block; margin-top: 4px; font-weight: 400; color: #a1a1aa;
    font-size: clamp(12px, 2vh, 15px); }
  .btn.primary { background: #4c1d95; border-color: #7c3aed; }
  .btn:focus { transform: scale(1.03); border-color: #c4b5fd; box-shadow: 0 0 0 6px rgba(139, 92, 246, .35); }
  #server { display: none; }
</style>
</head>
<body>
<div class="wrap" id="choose">
  <h1>MediaCenter</h1>
  <p>Медиатека для этого телевизора. Как будем работать?</p>
  <button class="btn primary" id="go-local" autofocus>Начать
    <small>Всё хранится на телевизоре, настройка — с телефона</small></button>
  <button class="btn" id="go-server">Подключить к серверу MediaCenter
    <small>Если у вас уже есть свой сервер и панель управления</small></button>
  <p id="local-status" style="margin-top:18px"></p>
</div>
<div class="wrap" id="server">
  <h1>Добавить это устройство в MediaCenter</h1>
  <p>Наведи камеру телефона на код — откроется страница подтверждения.</p>
  <div id="qr"></div>
  <p id="status" class="dots">Жду подтверждения</p>
  <p id="name" style="color:#71717a"></p>
</div>
<script src="qrcode.js"></script>
<script>
  var frag = decodeURIComponent(location.hash.slice(1) || "");
  var sep = frag.indexOf("|");
  var token = sep >= 0 ? frag.slice(0, sep) : frag;
  var model = sep >= 0 ? frag.slice(sep + 1) : "";
  if (model) document.getElementById("name").textContent = model;
  var url = "https://mc.arsidian.com/?enroll=" + encodeURIComponent(token) +
    (model ? "&name=" + encodeURIComponent(model) : "");
  var q = qrcode(0, "M");
  q.addData(url);
  q.make();
  document.getElementById("qr").innerHTML = q.createImgTag(8, 0);
  // The agent polls the server; once the config lands it broadcasts and MainActivity
  // reloads into the normal TV page. This handler is just in case the page outlives that.
  var chooser = document.getElementById("choose");
  var server = document.getElementById("server");
  var local = document.getElementById("go-local");
  var srv = document.getElementById("go-server");
  local.focus();
  local.onclick = function () {
    if (!window.MCApp || !MCApp.startStandalone) return;
    local.disabled = srv.disabled = true;
    var st = document.getElementById("local-status");
    st.className = "dots"; st.textContent = "Запускаюсь";
    MCApp.startStandalone();
  };
  srv.onclick = function () { chooser.style.display = "none"; server.style.display = "flex"; };
  // Remote control: up/down move between the two buttons, Back returns from the QR.
  document.addEventListener("keydown", function (e) {
    if (server.style.display === "flex") return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      (document.activeElement === local ? srv : local).focus();
    }
  });
  window.mcHandleBack = function () {
    if (server.style.display !== "flex") return false;
    server.style.display = "none"; chooser.style.display = "flex"; srv.focus();
    return true;
  };
  window.mcEnrolled = function () {
    document.getElementById("status").className = "ok";
    document.getElementById("status").textContent = "Устройство добавлено! Запускаюсь…";
  };
</script>
</body>
</html>
